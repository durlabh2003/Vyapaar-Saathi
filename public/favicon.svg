<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d5c48" />
      <stop offset="100%" stop-color="#06372b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Badge Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />

  <!-- Background Soundwaves Accent -->
  <g opacity="0.15" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round">
    <path d="M 90 256 A 166 166 0 0 1 422 256" fill="none" />
    <path d="M 130 256 A 126 126 0 0 1 382 256" fill="none" />
  </g>

  <!-- Central Emblem: Ledger Book + Voice Mic + Rupee Symbol -->
  <g filter="url(#shadow)">
    <!-- Ledger Book Shield Base -->
    <path d="M 140 140 C 140 120, 160 110, 256 110 C 352 110, 372 120, 372 140 L 372 340 C 372 370, 340 395, 256 395 C 172 395, 140 370, 140 340 Z" fill="#042f2e" opacity="0.85" />

    <!-- Ledger Gold Border -->
    <path d="M 140 140 C 140 120, 160 110, 256 110 C 352 110, 372 120, 372 140 L 372 340 C 372 370, 340 395, 256 395 C 172 395, 140 370, 140 340 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" />

    <!-- Voice Microphone Body -->
    <rect x="228" y="160" width="56" height="110" rx="28" fill="url(#goldGrad)" filter="url(#glow)" />

    <!-- Mic Cradle Stand -->
    <path d="M 200 220 A 56 56 0 0 0 312 220" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="256" y1="276" x2="256" y2="315" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="220" y1="315" x2="292" y2="315" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Active Voice Waves (Right Side) -->
    <path d="M 335 190 A 40 40 0 0 1 335 250" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 355 175 A 65 65 0 0 1 355 265" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Active Voice Waves (Left Side) -->
    <path d="M 177 190 A 40 40 0 0 0 177 250" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 157 175 A 65 65 0 0 0 157 265" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Rupee Growth Symbol (Gold Badge at Bottom Center) -->
    <circle cx="256" cy="355" r="28" fill="url(#goldGrad)" filter="url(#glow)" />
    <text x="256" y="365" font-family="'Mukta', 'Segoe UI', sans-serif" font-size="30" font-weight="bold" fill="#042f2e" text-anchor="middle">₹</text>
  </g>
</svg>
